<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Management - Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <div class="mobile-frame">
    <!-- Auth Background & Glow blobs -->
    <div class="auth-bg"></div>
    <div class="auth-glow-1"></div>
    <div class="auth-glow-2"></div>
    
    <div class="auth-container">
      <!-- Status Bar -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="icons">
          <span>📶</span>
          <span>🔋</span>
        </div>
      </div>
      
      <div class="auth-header">
        <div class="auth-badge">
          <span class="auth-badge-dot"></span>
          <span>Hall Meal Management</span>
        </div>
        <h1>Login to your<br>account</h1>
        <p>Manage meals with clarity and rhythm</p>
      </div>
      
      <div class="auth-card">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="student@example.com" value="student@example.com" />
        </div>
        
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="••••••••" value="password123" />
        </div>
        
        <button class="btn btn-primary" onclick="window.location.href='home.html'">Sign In</button>
        
        <div class="divider">or continue with</div>
        
        <div style="display: flex; gap: 12px; width: 100%;">
          <button class="btn btn-outline" style="flex: 1;" onclick="window.location.href='home.html'">
            Google
          </button>
          <button class="btn btn-outline" style="flex: 1;" onclick="window.location.href='admin.html'">
            Admin
          </button>
        </div>
        
        <div style="text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 4px;">
          Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign Up</a>
        </div>
      </div>
    </div>
    
    <!-- Home Indicator -->
    <div class="home-indicator"></div>
  </div>
</body>
</html>
